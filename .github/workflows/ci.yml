name: CyberJarvis CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 pulseaudio pulseaudio-utils

      - name: Start virtual audio server
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl info
          pactl load-module module-null-sink sink_name=ci_output
          pactl load-module module-null-source source_name=ci_input
          pactl set-default-source ci_input

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

      - name: Build Docker image
        run: |
          docker build -t cyberjarvis:ci .
